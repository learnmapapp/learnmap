name: Astro
logo: 🚀
color: "#ff5d01"
extension: astro
tagline: Fast websites from components, with JavaScript only where you need it.
comparisons:
  - javascript
  - typescript
  - python
syntax: astro
guide:
  name: Nova
  avatar: 🚀
  intro:
    - Hi, I'm Nova! Astro builds websites out of components, like React or Vue, but it turns them
      into plain HTML before they reach the browser. JavaScript only ships where you ask for it.
    - Every lesson has a short example, an exercise you solve right here in the browser, and a
      quick question. The course uses Astro 7; create a project on your machine to try the
      examples for real.
  askGoal: What would you like to build first?
