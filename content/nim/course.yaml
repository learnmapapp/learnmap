tagline: Python-like syntax, compiled to small, fast programs.
comparisons:
  - python
  - javascript
  - rust
syntax: nim
guide:
  name: Nia
  avatar: 👑
  intro:
    - Hi, I'm Nia! Nim reads a lot like Python, but it compiles to small, fast native programs,
      and its type checker catches mistakes before anything runs.
    - Every lesson has a short example, an exercise you solve right here in the browser, and a
      quick question. The course uses Nim 2.2; if you install Nim, you can run every example on
      your own machine too.
  askGoal: What would you like to build first?
