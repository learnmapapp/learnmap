  - rust
syntax: lua
guide:
  name: Luna
  avatar: 🌙
  intro:
    - Hi, I'm Luna! Lua is a tiny language with a big reach. It runs inside Neovim, Roblox (as Luau),
      Redis, game engines and nginx, and the whole thing fits in about 300 KB.
    - It has only a handful of ideas, and one of them, the table, does almost everything. Each lesson
      has a short example, a small exercise you solve in the browser, and a quick check. The examples
      use Lua 5.4.
  askGoal: What would you like to build first?
