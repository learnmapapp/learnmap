name: Nuxt
logo: 💚
color: "#00dc82"
extension: vue
tagline: Vue applications from pages to server routes.
comparisons:
  - javascript
  - typescript
  - python
syntax: nuxt
guide:
  name: Fern
  avatar: 💚
  intro:
    - Welcome! I'm Fern. Let's build something with Nuxt.
    - These fifty lessons use Nuxt 4 with Vue 3. Start with the foundations or pick a goal to follow
      a shorter route.
    - Read a small example, repair a piece of code, and check what you learned. Exercises check text
      here; use the local tools to run the examples.
  askGoal: What would you like to build first?
