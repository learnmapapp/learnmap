name: Nuxt
logo: 💚
color: "#00dc82"
extension: vue
tagline: Full-stack Vue apps, from the first page to the API behind it.
comparisons:
  - javascript
  - typescript
  - python
syntax: nuxt
guide:
  name: Fern
  avatar: 💚
  intro:
    - Hi, I'm Fern! Nuxt is a framework built on Vue. You write Vue components, and Nuxt adds
      file-based routing, server rendering, data fetching and a built-in API server.
    - Every lesson has a short example, an exercise you solve right here in the browser, and a
      quick question. The course uses Nuxt 4; create a project on your machine to try the
      examples for real.
  askGoal: What would you like to build first?
branches:
  - id: core
    title: Nuxt
    color: "#00dc82"
  - id: basics
    title: Vue foundations
    color: "#e0b84f"
  - id: components
    title: Reusable UI
    color: "#6fc2a8"
  - id: routing
    title: Pages & navigation
    color: "#7ebae4"
  - id: data
    title: Data & state
    color: "#d784b8"
  - id: server
    title: Server features
    color: "#9b8cf0"
  - id: production
    title: Production tools
    color: "#a7c957"
goals:
  - id: composables
    node: composables
    title: Build reusable Vue UI
    description: Build components with props, events and slots, and share logic with composables.
    icon: 🧱
  - id: layouts
    node: layouts
    title: Create a routed application
    description: Add pages, links, dynamic routes and a shared layout.
    icon: 🗺️
  - id: validation
    node: validation
    title: Build a server API
    description: Write API routes that check their input before using it.
    icon: 🛡️
  - id: capstone
    node: capstone
    title: Build a task dashboard
    description: Combine fetched data, forms, a server API and tests.
    icon: 🏁
