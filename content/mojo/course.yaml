name: Mojo
logo: 🔥
color: "#ff6a3d"
extension: mojo
tagline: Python-style syntax, compiled to fast native code.
comparisons:
  - python
  - javascript
  - rust
syntax: mojo
guide:
  name: Ember
  avatar: 🔥
  intro:
    - Hi, I'm Ember! Mojo looks a lot like Python, but it compiles to fast native code, and it gives
      you the tools to control types, memory and even individual CPU vector lanes.
    - If you know some Python, you'll feel at home on day one, and each lesson points out where Mojo
      differs. Every lesson has a short example, a small exercise you solve in the browser, and a
      quick check. The examples use Mojo 1.2.
  askGoal: What would you like to build first?
