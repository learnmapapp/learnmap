slice:
  definition: A view into a run of elements that live somewhere else, stored as a pointer plus a length. Written []T.
  node: slices
optional:
  definition: A value that may be missing. ?u32 holds either a u32 or null, and Zig makes you check which.
  node: optionals
pointer:
  definition: The memory address of a value. Written *T; follow it with p.* to reach the value itself.
  node: pointers
error set:
  definition: A list of named errors a function can return, such as error{ NotFound, Timeout }.
  node: error-sets
error union:
  definition: A return type like !u32 or MyError!u32, which holds either a value or an error.
  node: error-unions
allocator:
  definition: The object you ask for heap memory. Zig functions that allocate take one as a parameter, so allocation is never hidden.
  node: allocators
comptime:
  definition: Code that runs while the program compiles instead of when it runs. Also how Zig does generics.
  node: comptime
builtin:
  definition: A function provided by the compiler itself, always starting with @, such as @import or @intCast.
  node: zig
capture:
  definition: The |name| after if, while, for, switch or catch, which gives the unwrapped value a name.
  node: optionals
