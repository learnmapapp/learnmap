name: Zig
logo: ⚡
color: "#f7a41d"
extension: zig
tagline: Explicit control over data and memory.
comparisons:
  - python
  - javascript
  - rust
syntax: zig
guide:
  name: Zara
  avatar: ⚡
  intro:
    - Hi, I'm Zara! Zig is a small, fast language for programs where you want to see exactly what
      the machine is doing. No hidden memory allocations, no garbage collector, no surprises.
    - Every lesson has a short example, a little exercise you solve right here in the browser, and
      a quick check. If you have Zig installed, you can run the examples on your own machine too.
  askGoal: What would you like to build first?
