guide:
  name: Wren
  avatar: 🐦
  intro:
    - Hi, I'm Wren! Swift is the language behind iPhone and Mac apps, but it's also a pleasant,
      safe general-purpose language that runs on Linux and Windows too.
    - Each stop on the map has a short explanation, an exercise you solve right in the browser, and
      a quick question. Got Swift installed? Then try the examples on your own machine as well.
  askGoal: What would you like to build first?
