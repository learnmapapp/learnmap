  - { id: typescript, name: TypeScript, logo: "🔷", color: "#3178c6", category: Web, blurb: "JavaScript with types that explain and protect your code." }
  - { id: react, name: React, logo: "⚛️", color: "#61dafb", category: Web, blurb: "Build interactive interfaces from components and state." }
