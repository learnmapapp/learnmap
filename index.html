<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1b1a" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('learnmap:theme'); } catch {}
        const dark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? true;
        const theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f7f4ed' : '#1c1b1a';
      })();
    </script>
    <title>Learnmap</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
